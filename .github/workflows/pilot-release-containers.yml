name: Pilot Release Containers
on:
  pull_request:
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.web'
      - '.dockerignore'
      - '.github/workflows/pilot-release-containers.yml'
      - 'backend/app/**'
      - 'backend/requirements.txt'
      - 'web/app/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/public/**'
      - 'backend/sql/**'
      - 'scripts/**'
      - 'evaluation/**'
      - 'configs/**'
      - 'demo/**'
      - 'web/tsconfig.json'
      - 'web/postcss.config.mjs'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.web'
      - '.dockerignore'
      - '.github/workflows/pilot-release-containers.yml'
      - 'backend/app/**'
      - 'backend/sql/**'
      - 'backend/requirements.txt'
      - 'scripts/**'
      - 'evaluation/**'
      - 'configs/**'
      - 'demo/**'
      - 'web/app/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/public/**'
      - 'web/tsconfig.json'
      - 'web/postcss.config.mjs'
permissions:
  contents: read
jobs:
  protected-release-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Identify the actual checked-out source revision
        run: echo "KW_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build rootless API image from curated sources
        run: docker build --pull --build-arg KW_SOURCE_REVISION="$KW_SOURCE_REVISION" -f Dockerfile.api -t kw-api:ci .
      - name: Build protected-only Next.js image with no private environment
        run: docker build --pull --build-arg KW_SOURCE_REVISION="$KW_SOURCE_REVISION" -f Dockerfile.web -t kw-web:ci .
      - name: Verify image revision labels match actual checkout
        run: |
          set -euo pipefail
          test "$(docker image inspect kw-api:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$KW_SOURCE_REVISION"
          test "$(docker image inspect kw-web:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$KW_SOURCE_REVISION"
      - name: Save local-only build evidence, explicitly not a registry digest
        run: |
          set -euo pipefail
          python scripts/pilot_release_lock.py ci \
            --source-commit "$KW_SOURCE_REVISION" \
            --api-image-id "$(docker image inspect kw-api:ci --format '{{.Id}}')" \
            --web-image-id "$(docker image inspect kw-web:ci --format '{{.Id}}')" \
            --output /tmp/kw-ci-image-evidence.json
          python -c "import json; x=json.load(open('/tmp/kw-ci-image-evidence.json')); assert x['source_commit']=='$KW_SOURCE_REVISION'; assert x['registry_digest_independently_verified'] is False; assert x['real_site_deployment_independently_verified'] is False"
      - name: Retain nonsecret local build evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: kw-local-image-evidence
          path: /tmp/kw-ci-image-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify code and immutable sources are present; private assets absent
        run: |
          docker run --rm --entrypoint python kw-api:ci -c "from pathlib import Path;import os;assert os.geteuid()!=0; r=Path('/srv/kaushalwatch'); assert (r/'backend/sql/0003_camera_trust.sql').exists(); assert (r/'backend/sql/0002_private_evidence.sql').exists(); assert (r/'configs/vision_profiles/kaushalwatch-fixed-camera-v1.json').exists(); assert not list(r.rglob('*.avi')); assert not list(r.rglob('*.mp4')); assert not list(r.rglob('.env')); print('API image contains only reviewed source/config')"
          docker run --rm --entrypoint node kw-web:ci -e "const fs=require('node:fs');const p='/srv/web';if(process.getuid()===0)process.exit(2);if(process.env.NEXT_PUBLIC_KAUSHALWATCH_SECURE_PROXY!=='true'||process.env.KAUSHALWATCH_WEB_AUTH_MODE!=='protected'||process.env.KAUSHALWATCH_WEB_IDENTITY_MODE!=='oidc')process.exit(2);const dirs=fs.readdirSync(p+'/public/camera-trust').sort();if(JSON.stringify(dirs)!==JSON.stringify(['east-corridor.mp4','manifest.json','training-bay.mp4','workshop-floor.mp4']))process.exit(2);console.log('Web image protected; only approved sample media present')"
      - name: Exercise API container under an explicit synthetic, isolated config
        run: |
          docker run -d --name kw-api-smoke -p 127.0.0.1:18080:8000 \
            -e KAUSHALWATCH_ENV=development \
            -e KAUSHALWATCH_STORAGE_BACKEND=json \
            -e KAUSHALWATCH_EVIDENCE_BACKEND=local \
            -e KAUSHALWATCH_REVIEW_AUTH_MODE=demo \
            -e KAUSHAL_AI_ENABLED=false kw-api:ci
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health > /tmp/kw-container-health.json; then break; fi
            sleep 1
          done
          python -c "import json; x=json.load(open('/tmp/kw-container-health.json')); assert x['ok'] is True"
          curl --fail --silent http://127.0.0.1:18080/api/ready | python -c "import sys,json; assert json.load(sys.stdin)=={'ready':True}"
      - name: Confirm protected browser rejects missing production session configuration
        run: |
          docker run -d --name kw-web-smoke -p 127.0.0.1:13030:3000 kw-web:ci
          code=000
          for i in {1..40}; do
            code="$(curl -s -o /tmp/kw-web-auth.json -w '%{http_code}' http://127.0.0.1:13030/api/auth/status || true)"
            if test "$code" = 503; then break; fi
            sleep 1
          done
          if test "$code" != 503; then docker logs kw-web-smoke; exit 1; fi
          python -c "import json; x=json.load(open('/tmp/kw-web-auth.json')); assert x['mode']=='protected' and x['authenticated'] is False and x['detail']=='Officer session storage unavailable.'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13030/api/proxy/api/cases)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13030/api/auth/readiness)" = 503
          docker rm -f kw-web-smoke
      - name: Confirm anonymous proxy denial with isolated synthetic session configuration
        run: |
          docker run -d --name kw-web-smoke -p 127.0.0.1:13030:3000 \
            -e KAUSHALWATCH_ENV=staging \
            -e KAUSHALWATCH_ALLOW_EPHEMERAL_SESSIONS=true \
            -e KAUSHALWATCH_SESSION_STORE=memory kw-web:ci
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:13030/api/auth/status > /tmp/kw-web-auth.json; then break; fi
            sleep 1
          done
          if ! test -s /tmp/kw-web-auth.json; then docker logs kw-web-smoke; exit 1; fi
          python -c "import json; x=json.load(open('/tmp/kw-web-auth.json')); assert x['mode']=='protected' and x['identityMode']=='oidc' and x['authenticated'] is False"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13030/api/proxy/api/cases)" = 401
          # Deliberate synthetic memory sessions must never qualify as durable.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13030/api/auth/readiness)" = 503
          docker rm -f kw-web-smoke
      - name: Reject unreachable Redis even while anonymous auth status is 200
        run: |
          docker run -d --name kw-web-smoke -p 127.0.0.1:13030:3000 \
            -e KAUSHALWATCH_ENV=pilot \
            -e KAUSHALWATCH_SESSION_STORE=redis-rest \
            -e KAUSHALWATCH_SESSION_REDIS_REST_URL=http://127.0.0.1:6399 \
            -e KAUSHALWATCH_SESSION_REDIS_REST_TOKEN=CI_Synthetic_UnreachableRedisToken_0123456789abcdef \
            -e KAUSHALWATCH_SESSION_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            kw-web:ci
          for i in {1..40}; do
            if test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13030/api/auth/status)" = 200; then break; fi
            sleep 1
          done
          # Regression: missing cookie does not require Redis, but readiness does.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13030/api/auth/status)" = 200
          test "$(curl -s -o /tmp/kw-web-session-unready.json -w '%{http_code}' http://127.0.0.1:13030/api/auth/readiness)" = 503
          python -c "import json; x=json.load(open('/tmp/kw-web-session-unready.json')); assert x=={'ready':False,'mode':'protected'}"
      - name: Cleanup isolated smoke services
        if: always()
        run: docker rm -f kw-api-smoke kw-web-smoke 2>/dev/null || true
