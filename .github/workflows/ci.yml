name: ci

on:
  pull_request:
  push:
    branches: [main, "build/**"]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_repo_hygiene.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pip install ruff
      - run: python -m compileall -q backend/app scripts
      - run: ruff check backend/app scripts --select F821
      - run: pytest -q backend/tests
      - name: Smoke-test final demo evaluator
        run: |
          python evaluation/evaluate_final_demo.py \
            --attendance evaluation/final_demo_attendance.example.csv \
            --equipment evaluation/final_demo_equipment.example.csv \
            --operability evaluation/final_demo_operability.example.csv \
            --cases evaluation/final_demo_cases.example.csv \
            --out-dir /tmp/kaushalwatch-final-eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [hygiene, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python scripts/create_e2e_video.py --out /tmp/kaushalwatch-e2e.avi
      - name: Smoke-test demo readiness inspection
        run: |
          python scripts/check_demo_readiness.py \
            --video /tmp/kaushalwatch-e2e.avi > /tmp/kaushalwatch-readiness.json
          test -s /tmp/kaushalwatch-readiness.json
      - name: Smoke-test one-command demo rehearsal
        env:
          # The rehearsal smoke video is synthetic, so pair it with the synthetic
          # equipment cache rather than the SHA-256-bound reviewed DOD profile.
          KAUSHALWATCH_EQUIPMENT_CACHE: demo/cached_detections/construction_electrician.example.json
        run: |
          python scripts/run_final_demo_rehearsal.py \
            --video /tmp/kaushalwatch-e2e.avi \
            --out /tmp/kaushalwatch-rehearsal.json
          test -s /tmp/kaushalwatch-rehearsal.json
      - name: Start API
        env:
          # Browser E2E uses a tiny synthetic video; keep that test on the synthetic
          # discrepancy cache instead of weakening the SHA-1-bound reviewed DOD profile.
          KAUSHALWATCH_EQUIPMENT_CACHE: demo/cached_detections/construction_electrician.example.json
        run: |
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/kaushalwatch-api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat /tmp/kaushalwatch-api.log
          exit 1
      - name: Install and build web
        working-directory: web
        run: |
          npm install
          npm run build
          npx playwright install --with-deps chromium
      - name: Start web
        working-directory: web
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/kaushalwatch-web.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000 && exit 0
            sleep 1
          done
          cat /tmp/kaushalwatch-web.log
          exit 1
      - name: Run browser vertical slice
        working-directory: web
        env:
          E2E_VIDEO_PATH: /tmp/kaushalwatch-e2e.avi
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
