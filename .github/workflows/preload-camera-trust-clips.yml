name: Preload Camera Trust footage
on:
  push:
    branches: ['feat/submission-camera-monitor']
    paths: ['scripts/build_camera_trust_clips.py', '.github/workflows/preload-camera-trust-clips.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare H.264 encoder
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Generate three local recorded samples
        run: python scripts/build_camera_trust_clips.py
      - name: Verify H.264 recordings
        run: |
          for name in training-bay workshop-floor east-corridor; do
            test -s "web/public/camera-trust/$name.mp4"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
              -of default=noprint_wrappers=1 "web/public/camera-trust/$name.mp4" | grep -qx codec_name=h264
          done
      - name: Save self-contained preloaded assets to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f web/public/camera-trust/*.mp4 web/public/camera-trust/manifest.json
          if git diff --cached --quiet; then
            echo 'Clips already current'
          else
            git commit -m 'assets(camera-trust): preloaded local camera recordings'
            git push
          fi
