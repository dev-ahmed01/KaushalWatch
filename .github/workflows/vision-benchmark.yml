name: vision-benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vision-benchmark.yml"
      - "evaluation/benchmark_epfl_detection.py"
      - "backend/app/services/person_detector.py"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/vision-trigger"
      - ".github/workflows/vision-benchmark.yml"
      - "scripts/run_real_public_video_pipeline.py"
      - "backend/app/services/video_pipeline.py"
      - "backend/app/services/track_presence.py"

jobs:
  epfl-person-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vision dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-vision.txt

      - name: Download runtime-only benchmark assets
        run: |
          python scripts/download_epfl_lab_camera0.py
          python scripts/download_epfl_lab_c0_gt.py
          python scripts/download_openvino_person_model.py

      - name: Benchmark HOG baseline
        run: |
          python evaluation/benchmark_epfl_detection.py             --video data/raw/epfl/6p-c0.avi             --ground-truth data/raw/epfl/laboratory6-c0-gt.txt             --out-dir evaluation/output/epfl-hog             --detector hog             --step-frames 25             --iou-threshold 0.5

      - name: Benchmark OpenVINO
        env:
          KAUSHALWATCH_OPENVINO_MODEL_XML: models/openvino/person-detection-retail-0013/FP16/person-detection-retail-0013.xml
          KAUSHALWATCH_OPENVINO_DEVICE: CPU
          KAUSHALWATCH_PERSON_CONFIDENCE: "0.45"
        run: |
          python evaluation/benchmark_epfl_detection.py             --video data/raw/epfl/6p-c0.avi             --ground-truth data/raw/epfl/laboratory6-c0-gt.txt             --out-dir evaluation/output/epfl-openvino             --detector openvino             --step-frames 25             --iou-threshold 0.5

      - name: Verify real OpenVINO outputs before comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("evaluation/output/epfl-openvino/count_metrics.json").read_text())
          assert report["detector"] == "openvino"
          assert report["evaluated_frames"] > 0
          assert report["true_positives"] + report["false_negatives"] > 0
          assert 0 <= report["person_precision"] <= 1
          assert 0 <= report["person_recall"] <= 1
          print("EPFL OpenVINO real-inference evaluated frames:", report["evaluated_frames"])
          PY

      - name: Execute real OpenVINO attendance, camera trust and practical activity pipelines
        env:
          KAUSHALWATCH_PERSON_DETECTOR: openvino
          KAUSHALWATCH_OPENVINO_MODEL_XML: models/openvino/person-detection-retail-0013/FP16/person-detection-retail-0013.xml
          KAUSHALWATCH_OPENVINO_DEVICE: CPU
          KAUSHALWATCH_PERSON_CONFIDENCE: "0.45"
          KAUSHALWATCH_OPENVINO_TILED: "true"
          KAUSHALWATCH_OPENVINO_TILE_OVERLAP: "0.18"
          KAUSHALWATCH_OPENVINO_TILE_NMS_IOU: "0.45"
        run: |
          python scripts/run_real_public_video_pipeline.py \
            --video data/raw/epfl/6p-c0.avi \
            --seconds 6 \
            --ground-truth data/raw/epfl/laboratory6-c0-gt.txt \
            --out evaluation/output/epfl-real-pipeline-diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("evaluation/output/epfl-real-pipeline-diagnostic.json").read_text())
          assert x["status"] == "real_openvino_attendance_practical_camera_paths_executed"
          assert x["qualified"] is False
          assert x["attendance"]["detector_authoritative"] is True
          assert x["practical"]["detector_authoritative"] is True
          assert x["practical"]["authorization"] == "unknown"
          assert x["practical"]["decision"] != "unauthorized_practical_activity"
          assert x["temporal_diagnostic"]["all_sampled_frames"] == x["attendance"]["frames_sampled"]
          assert x["temporal_diagnostic"]["eligible_post_warmup_samples"] > 0
          assert x["temporal_diagnostic"]["classification"]
          assert x["public_annotation_diagnostic"]["annotation_sha256"]
          print("Temporal zero-occupancy classification:", x["temporal_diagnostic"]["classification"])
          print("EPFL early annotated-person samples:", x["public_annotation_diagnostic"]["sampled_frames_with_person_boxes"])
          print("Real model end-to-end diagnostic passed; no training-centre claims permitted")
          PY
          # Follow the same unmodified frozen detector/profile beyond the
          # late (~5.4 s) first annotated entrance. Development diagnostic only.
          python scripts/run_real_public_video_pipeline.py \
            --video data/raw/epfl/6p-c0.avi \
            --seconds 15 \
            --ground-truth data/raw/epfl/laboratory6-c0-gt.txt \
            --out evaluation/output/epfl-real-pipeline-15s-diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("evaluation/output/epfl-real-pipeline-15s-diagnostic.json").read_text())
          assert x["qualified"] is False
          assert x["attendance"]["detector_authoritative"] is True
          assert x["attendance"]["detector_failures"] == 0
          assert x["public_annotation_diagnostic"]["sampled_frames_with_person_boxes"] >= 2
          print("Longer public window confirmation classification:",
                x["temporal_diagnostic"]["classification"])
          print("Confirmed-positive samples:",
                x["temporal_diagnostic"]["post_warmup_confirmed_positive_samples"])
          print("15s estimated occupancy:", x["attendance"]["estimated_occupancy"])

          PY

      - name: Compare detectors
        run: |
          python evaluation/compare_detectors.py             --hog evaluation/output/epfl-hog/count_metrics.json             --openvino evaluation/output/epfl-openvino/count_metrics.json             --out evaluation/output/epfl-detector-comparison.json

      - uses: actions/upload-artifact@v4
        with:
          name: epfl-person-detection-benchmark
          path: |
            evaluation/output/epfl-hog/
            evaluation/output/epfl-openvino/
            evaluation/output/epfl-detector-comparison.json
            evaluation/output/epfl-real-pipeline-diagnostic.json
            evaluation/output/epfl-real-pipeline-15s-diagnostic.json
          if-no-files-found: error
          retention-days: 14
